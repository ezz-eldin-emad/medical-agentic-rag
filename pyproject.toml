[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medical-agentic-rag"
version = "0.1.0"
description = "Cloud medical RAG Telegram demo using Vercel, Qdrant Cloud, Hugging Face, and Groq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "qdrant-client>=1.7.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.40.0",
    "pydantic>=2.0.0",
    "python-telegram-bot>=20.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
ingestion = [
    "beautifulsoup4>=4.12.0",
    "langchain-text-splitters>=0.0.1",
    "tiktoken>=0.5.0",
    "tqdm>=4.66.0",
]
observability = [
    "arize-phoenix-otel>=0.16.0",
    "arize-phoenix>=13.14.0",
]


[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]

[tool.vercel]
entrypoint = "src.web.app:app"
