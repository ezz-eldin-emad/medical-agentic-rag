[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medical-agentic-rag"
version = "0.1.0"
description = "Local-first medical RAG system with configurable cloud LLM and embedding backends"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "qdrant-client>=1.7.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.40.0",
    "pydantic>=2.0.0",
    "python-telegram-bot>=20.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
local-ml = [
    "torch==2.13.0+cpu",
    "torchvision==0.28.0+cpu",
    "FlagEmbedding>=1.2.0",
    "huggingface-hub>=0.23.0",
]
ingestion = [
    "beautifulsoup4>=4.12.0",
    "langchain-text-splitters>=0.0.1",
    "tiktoken>=0.5.0",
    "tqdm>=4.66.0",
]
observability = [
    "arize-phoenix-otel>=0.16.0",
    "arize-phoenix>=13.14.0",
]
modal = [
    "modal>=0.62.0",
]


[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
